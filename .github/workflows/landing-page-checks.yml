name: Landing page checks

on:
  push:
    branches: ["feature/docs-site-landing-page"]

permissions:
  contents: read

jobs:
  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check application
        run: npm run type-check
